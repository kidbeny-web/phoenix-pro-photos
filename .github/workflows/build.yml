name: Fabriquer l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compiler
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk PhoenixProPhotos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoenixProPhotos-apk
          path: PhoenixProPhotos.apk

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version PhoenixProPhotos.apk \
            --title "Phoenix Pro Photos (Android) — build ${{ github.run_number }}" \
            --notes "APK prêt à installer sur le téléphone."
